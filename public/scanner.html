<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruralift Doc Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple: #6d28d9;
  --purple-light: #ede9fe;
  --navy: #1e1b4b;
  --navy-light: #312e81;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-400: #9ca3af;
  --gray-600: #4b5563;
  --gray-800: #1f2937;
  --green: #16a34a;
  --red: #dc2626;
  --white: #ffffff;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

/* TOP NAV */
.top-nav {
  background: var(--navy); color: #fff; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.top-nav h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.top-nav h1 svg { width: 20px; height: 20px; }
.top-nav a { color: rgba(255,255,255,.8); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
.top-nav a:hover { color: #fff; }

/* STEPS */
.step { display: none; padding: 16px; }
.step.active { display: block; }

/* CUSTOMER SEARCH */
.search-section { margin-bottom: 16px; }
.search-input {
  width: 100%; padding: 12px 14px; border: 2px solid var(--gray-200);
  border-radius: 10px; font-size: 15px; outline: none; transition: border .2s;
}
.search-input:focus { border-color: var(--purple); }
.search-results {
  margin-top: 8px; max-height: 200px; overflow-y: auto;
  border: 1px solid var(--gray-200); border-radius: 10px; background: #fff;
  display: none;
}
.search-results.show { display: block; }
.search-result-item {
  padding: 12px 14px; cursor: pointer; border-bottom: 1px solid var(--gray-100);
  font-size: 14px; transition: background .1s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover, .search-result-item:active { background: var(--purple-light); }
.search-result-item .name { font-weight: 600; color: var(--navy); }
.search-result-item .meta { font-size: 12px; color: var(--gray-600); margin-top: 2px; }

/* SELECTED CUSTOMER */
.selected-customer {
  background: var(--purple-light); border: 2px solid var(--purple);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  display: none; align-items: center; justify-content: space-between;
}
.selected-customer.show { display: flex; }
.selected-customer .info { font-size: 14px; font-weight: 600; color: var(--navy); }
.selected-customer .info .sub { font-size: 12px; color: var(--gray-600); font-weight: 400; }
.selected-customer button {
  background: none; border: none; color: var(--red); cursor: pointer; font-size: 20px; padding: 4px;
}

/* DOC TYPE */
.doc-type-group { margin-bottom: 16px; }
.doc-type-group label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-600); margin-bottom: 8px; }
.doc-type-options { display: flex; gap: 10px; }
.doc-type-btn {
  flex: 1; padding: 12px; border: 2px solid var(--gray-200); border-radius: 10px;
  background: #fff; cursor: pointer; text-align: center; font-size: 14px;
  font-weight: 500; transition: all .15s; color: var(--gray-800);
}
.doc-type-btn.active { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }

/* CAMERA */
.camera-container {
  position: fixed; inset: 0; background: #000; z-index: 200; display: none;
  flex-direction: column;
}
.camera-container.active { display: flex; }
.camera-header {
  background: rgba(0,0,0,.7); color: #fff; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
}
.camera-header .page-count { font-size: 14px; font-weight: 600; }
#camera-video { flex: 1; width: 100%; height: 100%; object-fit: cover; }
.camera-toolbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.7); padding: 16px;
  display: flex; align-items: center; justify-content: center; gap: 20px;
}
.capture-btn {
  width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff;
  background: rgba(255,255,255,.3); cursor: pointer; transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.capture-btn:active { transform: scale(0.9); background: rgba(255,255,255,.6); }
.capture-btn-inner { width: 56px; height: 56px; border-radius: 50%; background: #fff; }
.camera-close-btn {
  background: rgba(255,255,255,.2); border: none; color: #fff;
  width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer;
}
.camera-done-btn {
  background: var(--green); border: none; color: #fff;
  padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;
}

/* PAGES/THUMBNAILS */
.pages-section { margin-top: 16px; }
.pages-section h3 { font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 10px; }
.pages-strip {
  display: flex; gap: 10px; overflow-x: auto; padding: 8px 0;
  -webkit-overflow-scrolling: touch;
}
.page-thumb {
  flex-shrink: 0; width: 90px; position: relative; border-radius: 8px;
  overflow: hidden; border: 2px solid var(--gray-200); cursor: pointer; transition: border .15s;
}
.page-thumb.selected { border-color: var(--purple); }
.page-thumb img { width: 100%; height: 120px; object-fit: cover; display: block; }
.page-thumb .page-num {
  position: absolute; top: 4px; left: 4px; background: var(--navy);
  color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600;
}
.page-thumb .page-actions {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.6); display: flex; justify-content: space-around; padding: 4px;
}
.page-thumb .page-actions button {
  background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; padding: 2px;
}

/* ENHANCE PANEL */
.enhance-panel {
  background: #fff; border: 1px solid var(--gray-200); border-radius: 12px;
  padding: 16px; margin-top: 16px; display: none;
}
.enhance-panel.show { display: block; }
.enhance-preview {
  width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px;
  background: var(--gray-100); display: block; margin-bottom: 12px;
}
.enhance-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.enhance-btn {
  padding: 8px 14px; border: 1px solid var(--gray-200); border-radius: 8px;
  background: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
  transition: all .15s; display: flex; align-items: center; gap: 4px;
}
.enhance-btn:active { transform: scale(0.95); }
.enhance-btn.active { background: var(--purple-light); border-color: var(--purple); color: var(--purple); }
.slider-group { width: 100%; margin-bottom: 8px; }
.slider-group label { font-size: 12px; color: var(--gray-600); display: block; margin-bottom: 4px; }
.slider-group input[type="range"] { width: 100%; }

/* ACTION BUTTONS */
.action-bar {
  position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--gray-200);
  padding: 12px 16px; display: flex; gap: 10px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: none; transition: all .15s; text-decoration: none; flex: 1;
}
.btn-primary { background: var(--purple); color: #fff; }
.btn-primary:hover { background: #5b21b6; }
.btn-primary:disabled { background: var(--gray-400); cursor: not-allowed; }
.btn-outline { background: #fff; color: var(--gray-800); border: 2px solid var(--gray-200); }
.btn-outline:hover { background: var(--gray-50); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #15803d; }
.btn-green:disabled { background: var(--gray-400); cursor: not-allowed; }

/* UPLOAD PROGRESS */
.upload-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 300;
  display: none; align-items: center; justify-content: center;
}
.upload-overlay.show { display: flex; }
.upload-card {
  background: #fff; border-radius: 16px; padding: 32px; text-align: center;
  max-width: 320px; width: 90%;
}
.upload-card .spinner {
  width: 48px; height: 48px; border: 4px solid var(--gray-200);
  border-top-color: var(--purple); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.upload-card .status-text { font-size: 15px; color: var(--gray-800); font-weight: 500; }
.upload-card .success-icon { font-size: 48px; margin-bottom: 12px; }
.upload-card .error-text { color: var(--red); font-size: 13px; margin-top: 8px; }

/* TOAST */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--navy); color: #fff; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* RESPONSIVE */
@media (min-width: 600px) {
  .step { max-width: 560px; margin: 0 auto; }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
  <h1>
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
    Doc Scanner
  </h1>
  <a href="/">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Back to CRM
  </a>
</div>

<!-- STEP 1: SELECT CUSTOMER -->
<div class="step active" id="step-select">
  <div class="search-section">
    <input type="text" class="search-input" id="customer-search" placeholder="Search customer by name, mobile, Aadhaar..." oninput="searchCustomers(this.value)">
    <div class="search-results" id="search-results"></div>
  </div>

  <div class="selected-customer" id="selected-customer">
    <div class="info">
      <div id="selected-name"></div>
      <div class="sub" id="selected-meta"></div>
    </div>
    <button onclick="clearCustomer()">&times;</button>
  </div>

  <div class="doc-type-group">
    <label>Document Type</label>
    <div class="doc-type-options">
      <div class="doc-type-btn active" onclick="setDocType('agreement')" id="dt-agreement">Agreement</div>
      <div class="doc-type-btn" onclick="setDocType('receipt')" id="dt-receipt">Receipt</div>
    </div>
  </div>

  <div style="margin-top: 20px;">
    <button class="btn btn-primary" id="start-scan-btn" onclick="startCamera()" disabled>
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Start Scanning
    </button>
  </div>
</div>

<!-- STEP 2: REVIEW & ENHANCE PAGES -->
<div class="step" id="step-review">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <h3 style="font-size:16px; color:var(--navy);">Scanned Pages</h3>
    <button class="btn btn-outline" style="flex:0; padding:8px 14px;" onclick="startCamera()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Add More
    </button>
  </div>

  <div class="pages-strip" id="pages-strip"></div>

  <!-- Enhance Panel -->
  <div class="enhance-panel" id="enhance-panel">
    <canvas id="enhance-canvas" class="enhance-preview"></canvas>
    <div class="enhance-controls">
      <button class="enhance-btn" onclick="autoEnhance()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Auto Enhance
      </button>
      <button class="enhance-btn" onclick="sharpen()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Sharpen
      </button>
      <button class="enhance-btn" onclick="rotateImage()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Rotate
      </button>
      <button class="enhance-btn" onclick="resetEnhance()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        Reset
      </button>
    </div>
    <div class="slider-group">
      <label>Brightness: <span id="brightness-val">0</span></label>
      <input type="range" id="brightness-slider" min="-100" max="100" value="0" oninput="adjustBrightness(this.value)">
    </div>
    <div class="slider-group">
      <label>Contrast: <span id="contrast-val">0</span></label>
      <input type="range" id="contrast-slider" min="-100" max="100" value="0" oninput="adjustContrast(this.value)">
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-outline" onclick="goToStep('step-select')">Back</button>
    <button class="btn btn-green" id="upload-btn" onclick="createPdfAndUpload()">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
      Create PDF & Upload
    </button>
  </div>
</div>

<!-- CAMERA VIEW -->
<div class="camera-container" id="camera-container">
  <div class="camera-header">
    <button class="camera-close-btn" onclick="stopCamera()">&times;</button>
    <span class="page-count" id="camera-page-count">0 pages</span>
    <button class="camera-done-btn" onclick="stopCamera()" id="camera-done-btn" style="display:none">Done</button>
  </div>
  <video id="camera-video" autoplay playsinline></video>
  <div class="camera-toolbar">
    <div class="capture-btn" onclick="capturePhoto()">
      <div class="capture-btn-inner"></div>
    </div>
  </div>
</div>

<!-- HIDDEN CANVAS FOR CAPTURE -->
<canvas id="capture-canvas" style="display:none;"></canvas>

<!-- UPLOAD OVERLAY -->
<div class="upload-overlay" id="upload-overlay">
  <div class="upload-card" id="upload-card">
    <div class="spinner"></div>
    <div class="status-text">Creating PDF and uploading...</div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== STATE =====
let selectedCustomer = null;
let docType = 'agreement';
let pages = []; // Array of { original: dataURL, enhanced: dataURL, rotation: 0 }
let selectedPageIndex = -1;
let cameraStream = null;

// Stop camera stream when navigating away or closing tab
window.addEventListener('pagehide', () => {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
});

// ===== CUSTOMER SEARCH =====
let searchTimeout = null;
let lastSearchResults = []; // Store results for event delegation
function searchCustomers(q) {
  clearTimeout(searchTimeout);
  const results = document.getElementById('search-results');
  if (!q || q.length < 2) { results.classList.remove('show'); return; }
  searchTimeout = setTimeout(async () => {
    try {
      const res = await fetch('/api/customers?q=' + encodeURIComponent(q));
      const customers = await res.json();
      lastSearchResults = customers;
      if (customers.length === 0) {
        results.innerHTML = '<div class="search-result-item"><em>No customers found</em></div>';
      } else {
        results.innerHTML = customers.map((c, i) => {
          const name = document.createElement('span');
          name.textContent = c.name || 'Unknown';
          const meta = document.createElement('span');
          meta.textContent = (c.mobile || '') + ' | ' + (c.aadhaar || '');
          return `<div class="search-result-item" data-customer-index="${i}">
            <div class="name">${name.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}</div>
            <div class="meta">${meta.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}</div>
          </div>`;
        }).join('');
      }
      results.classList.add('show');
    } catch (e) { console.error(e); }
  }, 300);
}

// Event delegation for search result clicks
document.getElementById('search-results').addEventListener('click', function(e) {
  const item = e.target.closest('.search-result-item[data-customer-index]');
  if (item) {
    const index = parseInt(item.getAttribute('data-customer-index'), 10);
    if (lastSearchResults[index]) {
      selectCustomer(lastSearchResults[index]);
    }
  }
});

function selectCustomer(customer) {
  selectedCustomer = customer;
  document.getElementById('search-results').classList.remove('show');
  document.getElementById('customer-search').value = '';
  document.getElementById('selected-customer').classList.add('show');
  document.getElementById('selected-name').textContent = customer.name || 'Unknown';
  document.getElementById('selected-meta').textContent = `${customer.mobile || ''} | ${customer.aadhaar || ''}`;
  document.getElementById('start-scan-btn').disabled = false;
}

function clearCustomer() {
  selectedCustomer = null;
  document.getElementById('selected-customer').classList.remove('show');
  document.getElementById('start-scan-btn').disabled = true;
}

// ===== DOC TYPE =====
function setDocType(type) {
  docType = type;
  document.getElementById('dt-agreement').classList.toggle('active', type === 'agreement');
  document.getElementById('dt-receipt').classList.toggle('active', type === 'receipt');
}

// ===== NAVIGATION =====
function goToStep(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(stepId).classList.add('active');
}

// ===== CAMERA =====
async function startCamera() {
  const container = document.getElementById('camera-container');
  const video = document.getElementById('camera-video');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = cameraStream;
    container.classList.add('active');
    updatePageCount();
  } catch (err) {
    showToast('Camera access denied. Please allow camera permission.');
    console.error(err);
  }
}

function stopCamera() {
  const container = document.getElementById('camera-container');
  const video = document.getElementById('camera-video');
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  video.srcObject = null;
  container.classList.remove('active');
  if (pages.length > 0) {
    goToStep('step-review');
    renderPages();
  }
}

function capturePhoto() {
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('capture-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const dataURL = canvas.toDataURL('image/jpeg', 0.92);
  pages.push({ captured: dataURL, original: dataURL, enhanced: dataURL, rotation: 0 });
  updatePageCount();
  showToast('Page ' + pages.length + ' captured');
  // Flash effect
  const container = document.getElementById('camera-container');
  container.style.opacity = '0.5';
  setTimeout(() => { container.style.opacity = '1'; }, 100);
}

function updatePageCount() {
  const count = pages.length;
  document.getElementById('camera-page-count').textContent = count + (count === 1 ? ' page' : ' pages');
  document.getElementById('camera-done-btn').style.display = count > 0 ? 'block' : 'none';
}

// ===== PAGES RENDERING =====
function renderPages() {
  const strip = document.getElementById('pages-strip');
  strip.innerHTML = pages.map((p, i) => `
    <div class="page-thumb ${i === selectedPageIndex ? 'selected' : ''}" onclick="selectPage(${i})">
      <img src="${p.enhanced}" alt="Page ${i+1}">
      <span class="page-num">${i+1}</span>
      <div class="page-actions">
        ${i > 0 ? '<button onclick="event.stopPropagation();movePage(' + i + ',-1)" title="Move left">&larr;</button>' : '<button style="visibility:hidden">&larr;</button>'}
        <button onclick="event.stopPropagation();deletePage(${i})" title="Delete">&times;</button>
        ${i < pages.length - 1 ? '<button onclick="event.stopPropagation();movePage(' + i + ',1)" title="Move right">&rarr;</button>' : '<button style="visibility:hidden">&rarr;</button>'}
      </div>
    </div>
  `).join('');
  document.getElementById('upload-btn').disabled = pages.length === 0;
}

function selectPage(index) {
  selectedPageIndex = index;
  renderPages();
  showEnhancePanel(index);
}

function deletePage(index) {
  pages.splice(index, 1);
  if (selectedPageIndex >= pages.length) selectedPageIndex = pages.length - 1;
  if (pages.length === 0) {
    selectedPageIndex = -1;
    document.getElementById('enhance-panel').classList.remove('show');
  }
  renderPages();
  if (selectedPageIndex >= 0) showEnhancePanel(selectedPageIndex);
}

function movePage(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= pages.length) return;
  const temp = pages[index];
  pages[index] = pages[newIndex];
  pages[newIndex] = temp;
  if (selectedPageIndex === index) selectedPageIndex = newIndex;
  else if (selectedPageIndex === newIndex) selectedPageIndex = index;
  renderPages();
}

// ===== IMAGE ENHANCEMENT =====
function showEnhancePanel(index) {
  const panel = document.getElementById('enhance-panel');
  panel.classList.add('show');
  // Reset sliders
  document.getElementById('brightness-slider').value = 0;
  document.getElementById('contrast-slider').value = 0;
  document.getElementById('brightness-val').textContent = '0';
  document.getElementById('contrast-val').textContent = '0';
  drawEnhanced(index);
}

function drawEnhanced(index) {
  const canvas = document.getElementById('enhance-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    // Limit display size
    canvas.style.width = '100%';
    canvas.style.maxHeight = '300px';
    ctx.drawImage(img, 0, 0);
  };
  img.src = pages[index].enhanced;
}

function autoEnhance() {
  if (selectedPageIndex < 0) return;
  const canvas = document.getElementById('enhance-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    // Convert to grayscale
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      data[i] = data[i+1] = data[i+2] = gray;
    }

    // Contrast stretch
    let min = 255, max = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] < min) min = data[i];
      if (data[i] > max) max = data[i];
    }
    const range = max - min || 1;
    for (let i = 0; i < data.length; i += 4) {
      const val = ((data[i] - min) / range) * 255;
      data[i] = data[i+1] = data[i+2] = val;
    }

    // Adaptive threshold for document look
    for (let i = 0; i < data.length; i += 4) {
      const val = data[i] > 140 ? 255 : 0;
      data[i] = data[i+1] = data[i+2] = val;
    }

    ctx.putImageData(imageData, 0, 0);
    pages[selectedPageIndex].enhanced = canvas.toDataURL('image/jpeg', 0.92);
    renderPages();
  };
  img.src = pages[selectedPageIndex].original;
}

function adjustBrightness(value) {
  document.getElementById('brightness-val').textContent = value;
  applyBrightnessContrast();
}

function adjustContrast(value) {
  document.getElementById('contrast-val').textContent = value;
  applyBrightnessContrast();
}

function applyBrightnessContrast() {
  if (selectedPageIndex < 0) return;
  const brightness = parseInt(document.getElementById('brightness-slider').value);
  const contrast = parseInt(document.getElementById('contrast-slider').value);
  const canvas = document.getElementById('enhance-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));

    for (let i = 0; i < data.length; i += 4) {
      data[i] = clamp(factor * (data[i] - 128) + 128 + brightness);
      data[i+1] = clamp(factor * (data[i+1] - 128) + 128 + brightness);
      data[i+2] = clamp(factor * (data[i+2] - 128) + 128 + brightness);
    }

    ctx.putImageData(imageData, 0, 0);
    pages[selectedPageIndex].enhanced = canvas.toDataURL('image/jpeg', 0.92);
    renderPages();
  };
  img.src = pages[selectedPageIndex].original;
}

function clamp(val) { return Math.max(0, Math.min(255, Math.round(val))); }

function sharpen() {
  if (selectedPageIndex < 0) return;
  const canvas = document.getElementById('enhance-canvas');
  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  const w = canvas.width;
  const h = canvas.height;

  // 3x3 sharpen kernel
  const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];
  const output = new Uint8ClampedArray(data.length);

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        for (let ky = -1; ky <= 1; ky++) {
          for (let kx = -1; kx <= 1; kx++) {
            const idx = ((y + ky) * w + (x + kx)) * 4 + c;
            sum += data[idx] * kernel[(ky + 1) * 3 + (kx + 1)];
          }
        }
        output[(y * w + x) * 4 + c] = clamp(sum);
      }
      output[(y * w + x) * 4 + 3] = 255;
    }
  }

  // Copy edges from original
  for (let x = 0; x < w; x++) {
    for (let c = 0; c < 4; c++) {
      output[x * 4 + c] = data[x * 4 + c];
      output[((h-1) * w + x) * 4 + c] = data[((h-1) * w + x) * 4 + c];
    }
  }
  for (let y = 0; y < h; y++) {
    for (let c = 0; c < 4; c++) {
      output[(y * w) * 4 + c] = data[(y * w) * 4 + c];
      output[(y * w + w - 1) * 4 + c] = data[(y * w + w - 1) * 4 + c];
    }
  }

  const newImageData = new ImageData(output, w, h);
  ctx.putImageData(newImageData, 0, 0);
  pages[selectedPageIndex].enhanced = canvas.toDataURL('image/jpeg', 0.92);
  pages[selectedPageIndex].original = pages[selectedPageIndex].enhanced; // Make sharpen cumulative
  renderPages();
}

function rotateImage() {
  if (selectedPageIndex < 0) return;
  const canvas = document.getElementById('enhance-canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = () => {
    // Swap dimensions for 90-degree rotation
    const newW = img.height;
    const newH = img.width;
    canvas.width = newW;
    canvas.height = newH;
    ctx.translate(newW, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const dataURL = canvas.toDataURL('image/jpeg', 0.92);
    pages[selectedPageIndex].enhanced = dataURL;
    pages[selectedPageIndex].original = dataURL;
    pages[selectedPageIndex].rotation = (pages[selectedPageIndex].rotation + 90) % 360;
    renderPages();
  };
  img.src = pages[selectedPageIndex].enhanced;
}

function resetEnhance() {
  if (selectedPageIndex < 0) return;
  // Restore from the untouched captured original
  pages[selectedPageIndex].original = pages[selectedPageIndex].captured;
  pages[selectedPageIndex].enhanced = pages[selectedPageIndex].captured;
  pages[selectedPageIndex].rotation = 0;
  document.getElementById('brightness-slider').value = 0;
  document.getElementById('contrast-slider').value = 0;
  document.getElementById('brightness-val').textContent = '0';
  document.getElementById('contrast-val').textContent = '0';
  drawEnhanced(selectedPageIndex);
  renderPages();
}

// ===== PDF CREATION & UPLOAD =====
async function createPdfAndUpload() {
  if (!selectedCustomer || pages.length === 0) {
    showToast('Please select a customer and capture at least one page.');
    return;
  }

  // Disable upload button to prevent double-tap
  const uploadBtn = document.getElementById('upload-btn');
  uploadBtn.disabled = true;

  const overlay = document.getElementById('upload-overlay');
  const card = document.getElementById('upload-card');
  overlay.classList.add('show');
  card.innerHTML = '<div class="spinner"></div><div class="status-text">Creating PDF...</div>';

  try {
    // Create PDF using jsPDF
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageWidth = 210;
    const pageHeight = 297;
    const margin = 5;

    for (let i = 0; i < pages.length; i++) {
      if (i > 0) pdf.addPage();

      // Load image to get dimensions
      const imgData = pages[i].enhanced;
      const dims = await getImageDimensions(imgData);
      const imgAspect = dims.width / dims.height;
      const availW = pageWidth - margin * 2;
      const availH = pageHeight - margin * 2;
      const pageAspect = availW / availH;

      let w, h;
      if (imgAspect > pageAspect) {
        w = availW;
        h = availW / imgAspect;
      } else {
        h = availH;
        w = availH * imgAspect;
      }

      const x = (pageWidth - w) / 2;
      const y = (pageHeight - h) / 2;
      pdf.addImage(imgData, 'JPEG', x, y, w, h, undefined, 'MEDIUM');
    }

    card.innerHTML = '<div class="spinner"></div><div class="status-text">Uploading to server...</div>';

    // Convert to blob
    const pdfBlob = pdf.output('blob');
    const formData = new FormData();
    formData.append('file', pdfBlob, docType + '-' + selectedCustomer.id + '.pdf');

    // Upload using the scanned endpoint
    const res = await fetch(`/api/customers/${selectedCustomer.id}/upload-scanned/${docType}`, {
      method: 'POST',
      body: formData
    });

    const result = await res.json();
    if (res.ok && result.ok) {
      card.innerHTML = `
        <div class="success-icon">&#10004;</div>
        <div class="status-text" style="color:var(--green)">Upload Successful!</div>
        <p style="font-size:13px;color:var(--gray-600);margin-top:8px">${pages.length} page PDF uploaded as ${docType} for ${selectedCustomer.name}</p>
        <a href="/" style="display:inline-block;margin-top:16px;color:var(--purple);font-weight:600;text-decoration:none;">View in CRM &rarr;</a>
      `;
      // Reset state
      pages = [];
      selectedPageIndex = -1;
    } else {
      throw new Error(result.error || 'Upload failed');
    }

    // Auto close after 3s
    setTimeout(() => { overlay.classList.remove('show'); goToStep('step-select'); }, 4000);

  } catch (err) {
    card.innerHTML = `
      <div class="success-icon" style="color:var(--red)">&#10008;</div>
      <div class="status-text" style="color:var(--red)">Upload Failed</div>
      <div class="error-text">${err.message}</div>
      <button class="btn btn-outline" style="margin-top:16px;flex:0;" onclick="document.getElementById('upload-overlay').classList.remove('show')">Close</button>
    `;
    // Re-enable upload button on failure
    document.getElementById('upload-btn').disabled = false;
  }
}

function getImageDimensions(dataURL) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve({ width: img.width, height: img.height });
    img.src = dataURL;
  });
}

// ===== TOAST =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
